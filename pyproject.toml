[project]
name = "nrpylatex"
version = "1.5.0"
description = "LaTeX Interface to SymPy (CAS) for General Relativity"
readme = "README.md"
license = { text = "BSD-2-Clause" }
authors = [{ name = "Ken Sible", email = "ksible@outlook.com" }]
requires-python = ">=3.6"
dependencies = ["sympy>=1.9,<2.0"]

keywords = []
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Text Processing :: Markup :: LaTeX",
    "Topic :: Software Development :: Code Generators",
]

[project.urls]
homepage = "https://github.com/nrpy/nrpylatex"
source = "https://github.com/nrpy/nrpylatex"
issues = "https://github.com/nrpy/nrpylatex/issues"
changelog = "https://github.com/nrpy/nrpylatex/releases"

[project.optional-dependencies]
jupyter = ['ipython>=7.16.0']

[dependency-groups]
dev = [
    "ruff>=0.15.15; python_version >= '3.10'",
    "mypy>=2.1.0; python_version >= '3.10'",
    "pytest>=7.0,<9.0; python_version < '3.10'",
    "pytest>=9.0.3; python_version >= '3.10'",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.format]
quote-style = "single"

[tool.mypy]
strict = true
ignore_missing_imports = true
disable_error_code = ["no-untyped-call"]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"
