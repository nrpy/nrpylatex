[project]
name = "nrpylatex"
version = "1.5.0"
description = "LaTeX Interface to SymPy (CAS) for General Relativity"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Ken Sible", email = "ksible@outlook.com" }]
requires-python = ">=3.7"
dependencies = ["sympy>=1.9,<2.0"]

keywords = []
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Text Processing :: Markup :: LaTeX",
    "Topic :: Software Development :: Code Generators",
]

[project.optional-dependencies]
jupyter = ['ipython>=7.16.0']

[dependency-groups]
dev = ["nrpy @ https://github.com/nrpy/nrpy.git", "ruff", "mypy", "pytest"]

[project.urls]
homepage = "https://github.com/nrpy/nrpylatex"
source = "https://github.com/nrpy/nrpylatex"
issues = "https://github.com/nrpy/nrpylatex/issues"
changelog = "https://github.com/nrpy/nrpylatex/releases"

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
extend-select = ["I", "S"]

[tool.ruff.lint.per-file-ignores]
"src/**/*.py" = ["S102", "S105", "S307"]
"tests/**/*.py" = ["S101"]

[tool.ruff.format]
quote-style = "single"

[tool.mypy]
files = ["src"]
strict = true
ignore_missing_imports = true

[tool.hatch.metadata]
allow-direct-references = true

[build-system]
requires = ["hatchling>=1.17.0"]
build-backend = "hatchling.build"
