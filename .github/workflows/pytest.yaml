name: Python CI

on:
  push:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sympy-latest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.9', '3.14']
    steps:
      - name: Enable Long Paths (Windows)
        if: matrix.os == 'windows-latest'
        run: git config --system core.longpaths true
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Package Manager
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Install Python Dependencies
        run: uv sync --locked --all-groups --all-extras
      - name: Run NRPyLaTeX Unit Tests
        run: uv run --no-sync pytest -s
      - name: Run NRPy BSSN Unit Tests
        run: >-
          uv run --no-sync pytest -s
          --pyargs nrpy.equations.general_relativity.nrpylatex.test_parse_BSSN

  sympy-earliest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Package Manager
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: '3.9'
      - name: Install Python Dependencies
        run: uv sync --locked --all-groups --all-extras
      - name: Install Earliest-Supported SymPy
        run: uv pip install --reinstall "sympy==1.9"
      - name: Run NRPyLaTeX Unit Tests
        run: uv run --no-sync pytest -s
      - name: Run NRPy BSSN Unit Tests
        run: >-
          uv run --no-sync pytest -s
          --pyargs nrpy.equations.general_relativity.nrpylatex.test_parse_BSSN

  sympy-dev:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.14']
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Package Manager
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Install Python Dependencies
        run: uv sync --locked --all-groups --all-extras
      - name: Install Development SymPy
        run: uv pip install --upgrade "sympy @ git+https://github.com/sympy/sympy.git"
      - name: Run NRPyLaTeX Unit Tests
        run: uv run --no-sync pytest -s
      - name: Run NRPy BSSN Unit Tests
        run: >-
          uv run --no-sync pytest -s
          --pyargs nrpy.equations.general_relativity.nrpylatex.test_parse_BSSN
